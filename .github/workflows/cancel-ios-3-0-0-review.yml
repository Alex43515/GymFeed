name: Replace iOS 3.0.0 review with 3.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-old-review:
    runs-on: ubuntu-24.04
    environment: app-store-connect
    timeout-minutes: 10
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      REVIEW_SUBMISSION_ID: 37e05d91-3fc5-48c8-92d1-e654b3b844bb

    steps:
      - name: Install App Store Connect tools
        run: python3 -m pip install --disable-pip-version-check codemagic-cli-tools

      - name: Prepare protected Apple API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_KEY_IDENTIFIER"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/app-store-connect-key.p8"
          chmod 600 "$RUNNER_TEMP/app-store-connect-key.p8"
          echo "APP_STORE_CONNECT_PRIVATE_KEY=@file:$RUNNER_TEMP/app-store-connect-key.p8" >> "$GITHUB_ENV"

      - name: Cancel obsolete 3.0.0 review
        shell: bash
        run: |
          set -euo pipefail
          app-store-connect review-submissions get "$REVIEW_SUBMISSION_ID"
          app-store-connect review-submissions cancel "$REVIEW_SUBMISSION_ID"
          app-store-connect review-submissions get "$REVIEW_SUBMISSION_ID"

      - name: Remove temporary Apple API key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/app-store-connect-key.p8"
