name: Deploy GymFeed iOS

on:
  push:
    branches:
      - main
      - release/**
    paths:
      - .github/workflows/deploy-ios-testflight.yml
      - assets/**
      - ios/**
      - lib/**
      - pubspec.lock
      - pubspec.yaml
  workflow_dispatch:
    inputs:
      destination:
        description: Apple deployment destination
        required: true
        default: testflight
        type: choice
        options:
          - testflight
          - app-store

permissions:
  contents: read

concurrency:
  group: gymfeed-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.27.4
  IOS_BUNDLE_ID: com.flutterflow.gymfeedofficial
  IOS_EXTENSION_BUNDLE_ID: com.flutterflow.gymfeedofficial.ImageNotification
  APP_STORE_WHATS_NEW: GymFeed 2.3.1 includes reliability improvements, refreshed social and workout experiences, and important account-flow fixes.

jobs:
  validate-ios:
    name: Test and build iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify current Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/Xcode/{split($2, version, "."); print version[1]}')"
          if [[ ! "$xcode_major" =~ ^[0-9]+$ ]] || (( xcode_major < 26 )); then
            echo "::error::GymFeed App Store builds require Xcode 26 or newer"
            exit 1
          fi

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --branch "$FLUTTER_VERSION" \
            --depth 1 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios

      - name: Install Flutter and CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          pod install --project-directory=ios --repo-update

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build unsigned Simulator app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios \
            --simulator \
            --debug \
            --no-pub
          test -d build/ios/iphonesimulator/Runner.app

      - name: Upload Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: gymfeed-ios-simulator-${{ github.run_number }}
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 7

  publish-ios:
    name: Build signed IPA and deploy to Apple
    needs: validate-ios
    runs-on: macos-26
    environment: app-store-connect
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version and Apple destination
        shell: bash
        run: |
          set -euo pipefail

          app_version="$(awk '/^version:/{split($2, value, "+"); print value[1]; exit}' pubspec.yaml)"
          if [[ -z "$app_version" ]]; then
            echo "::error::Could not read the app version from pubspec.yaml"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            destination="${{ inputs.destination }}"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            destination="app-store"
          else
            destination="testflight"
          fi

          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            branch_version="${GITHUB_REF_NAME#release/}"
            if [[ "$branch_version" != "$app_version" ]]; then
              echo "::error::Release branch $GITHUB_REF_NAME must match pubspec version $app_version"
              exit 1
            fi
          fi

          case "$destination" in
            testflight|app-store) ;;
            *) echo "::error::Unsupported destination: $destination"; exit 1 ;;
          esac

          echo "IOS_MARKETING_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "DEPLOY_DESTINATION=$destination" >> "$GITHUB_ENV"
          echo "Deploying GymFeed $app_version to Apple $destination"

      - name: Verify current Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/Xcode/{split($2, version, "."); print version[1]}')"
          if [[ ! "$xcode_major" =~ ^[0-9]+$ ]] || (( xcode_major < 26 )); then
            echo "::error::GymFeed App Store builds require Xcode 26 or newer"
            exit 1
          fi

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --branch "$FLUTTER_VERSION" \
            --depth 1 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios

      - name: Install build and App Store dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          pod install --project-directory=ios --repo-update
          python3 -m venv "$RUNNER_TEMP/codemagic-cli"
          "$RUNNER_TEMP/codemagic-cli/bin/python" -m pip install \
            --disable-pip-version-check \
            codemagic-cli-tools
          echo "$RUNNER_TEMP/codemagic-cli/bin" >> "$GITHUB_PATH"

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Validate protected Apple credentials
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_PRIVATE_KEY_BASE64: ${{ secrets.IOS_DISTRIBUTION_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for value in \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64 \
            IOS_DISTRIBUTION_PRIVATE_KEY_BASE64; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Missing GitHub Actions secret: $value"
              exit 1
            fi
          done

          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" \
            | /usr/bin/base64 -D \
            > "$RUNNER_TEMP/app-store-connect-key.p8"
          printf '%s' "$IOS_DISTRIBUTION_PRIVATE_KEY_BASE64" \
            | /usr/bin/base64 -D \
            > "$RUNNER_TEMP/ios-distribution-private-key.pem"
          chmod 600 \
            "$RUNNER_TEMP/app-store-connect-key.p8" \
            "$RUNNER_TEMP/ios-distribution-private-key.pem"

          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/app-store-connect-key.p8"
          openssl pkey \
            -in "$RUNNER_TEMP/ios-distribution-private-key.pem" \
            -check \
            -noout

      - name: Configure App Store signing and build IPA
        id: build-ipa
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          export APP_STORE_CONNECT_PRIVATE_KEY
          APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$RUNNER_TEMP/app-store-connect-key.p8")"

          keychain initialize
          app-store-connect fetch-signing-files "$IOS_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key="@file:$RUNNER_TEMP/ios-distribution-private-key.pem" \
            --create
          app-store-connect fetch-signing-files "$IOS_EXTENSION_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key="@file:$RUNNER_TEMP/ios-distribution-private-key.pem" \
            --create
          keychain add-certificates
          xcode-project use-profiles

          ios_build_number="$(date -u +'%Y%m%d%H%M')"
          echo "IOS_BUILD_NUMBER=$ios_build_number" >> "$GITHUB_ENV"

          flutter build ipa \
            --release \
            --no-pub \
            --build-name "$IOS_MARKETING_VERSION" \
            --build-number "$ios_build_number" \
            --export-options-plist="$HOME/export_options.plist"

          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" || ! -s "$ipa_path" ]]; then
            echo "::error::Flutter did not produce a release IPA"
            exit 1
          fi
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

          archive_app="$(find build/ios/archive -path '*.xcarchive/Products/Applications/*.app' -print -quit)"
          if [[ -z "$archive_app" ]]; then
            echo "::error::Flutter did not produce a signed Xcode archive"
            exit 1
          fi
          codesign --verify --deep --strict "$archive_app"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymfeed-ios-${{ env.IOS_MARKETING_VERSION }}-${{ env.DEPLOY_DESTINATION }}-${{ env.IOS_BUILD_NUMBER }}
          path: ${{ steps.build-ipa.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to selected Apple destination
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          IPA_PATH: ${{ steps.build-ipa.outputs.ipa_path }}
        run: |
          set -euo pipefail
          export APP_STORE_CONNECT_PRIVATE_KEY
          APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$RUNNER_TEMP/app-store-connect-key.p8")"

          if [[ "$DEPLOY_DESTINATION" == "app-store" ]]; then
            # Apple still performs App Review. AFTER_APPROVAL makes the
            # approved version release automatically without another action.
            app-store-connect publish \
              --path "$IPA_PATH" \
              --app-store \
              --platform IOS \
              --version-string "$IOS_MARKETING_VERSION" \
              --release-type AFTER_APPROVAL \
              --copyright GymFeed \
              --locale en-US \
              --whats-new "$APP_STORE_WHATS_NEW"
          else
            # Internal TestFlight group "testers" has access to all builds,
            # so a valid processed upload becomes available automatically.
            app-store-connect publish --path "$IPA_PATH"
          fi

      - name: Restore keychain and remove temporary credentials
        if: ${{ always() }}
        shell: bash
        run: |
          keychain use-login || true
          rm -f \
            "$RUNNER_TEMP/app-store-connect-key.p8" \
            "$RUNNER_TEMP/ios-distribution-private-key.pem"
