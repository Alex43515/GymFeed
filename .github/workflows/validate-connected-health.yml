name: Validate connected health

on:
  push:
    branches: [codex/connected-health]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connected-health-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Test health integration and compile iOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected Xcode toolchain
        run: xcodebuild -version
      - name: Install repository Flutter version
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch 3.27.4 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios
      - name: Install dependencies
        run: |
          flutter pub get
          pod install --project-directory=ios --repo-update
      - name: Verify health feature
        run: |
          flutter analyze lib/health test/connected_health_test.dart test/device_health_gateway_test.dart
          flutter test --no-pub
      - name: Start iPhone Simulator while the app compiles
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,group in data["devices"].items() if ".iOS-" in runtime for d in group if d["name"].startswith("iPhone")))')"
          echo "HEALTH_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id" || true
      - name: Compile unsigned iOS Simulator app
        run: flutter build ios --simulator --debug --no-pub
      - name: Validate main app and notification extension versions
        run: python3 scripts/validate_ios_extension_versions.py build/ios/iphonesimulator/Runner.app
      - name: Save full Simulator app before the test harness rebuilds it
        uses: actions/upload-artifact@v4
        with:
          name: connected-health-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 7
      - name: Test native health screen on iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$HEALTH_SIMULATOR_ID" -b
          flutter test integration_test/connected_health_device_test.dart --no-pub -d "$HEALTH_SIMULATOR_ID"
