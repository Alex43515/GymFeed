name: Deploy GymFeed website

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-website.yml
      - assets/**
      - lib/**
      - pubspec.lock
      - pubspec.yaml
      - web/**
      - website/public_html/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gymfeed-production-website
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.27.4

jobs:
  build-and-deploy:
    name: Build and deploy to gymfeed.io
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --branch "$FLUTTER_VERSION" \
            --depth 1 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --enable-web --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release website
        run: flutter build web --release --no-pub

      - name: Assemble Namecheap release
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="$RUNNER_TEMP/gymfeed-deploy"
          mkdir -p "$deploy_dir"

          rsync -a --delete build/web/ "$deploy_dir/"

          # These files are maintained outside Flutter's generated build output.
          install -m 0644 website/public_html/.htaccess "$deploy_dir/.htaccess"
          install -m 0644 website/public_html/post.php "$deploy_dir/post.php"
          install -m 0644 website/public_html/report-mail.php "$deploy_dir/report-mail.php"
          rsync -a website/public_html/.well-known/ "$deploy_dir/.well-known/"
          rsync -a website/public_html/assets/ "$deploy_dir/assets/"
          rsync -a website/public_html/privacy/ "$deploy_dir/privacy/"
          rsync -a website/public_html/support/ "$deploy_dir/support/"
          rsync -a website/public_html/terms/ "$deploy_dir/terms/"

          test -s "$deploy_dir/index.html"
          test -s "$deploy_dir/main.dart.js"
          test -s "$deploy_dir/.htaccess"
          test -s "$deploy_dir/.well-known/assetlinks.json"
          test -s "$deploy_dir/post.php"
          test -s "$deploy_dir/report-mail.php"

      - name: Validate Namecheap deployment secrets
        shell: bash
        env:
          NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          NAMECHEAP_SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          NAMECHEAP_SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          NAMECHEAP_SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
          NAMECHEAP_DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for value in \
            NAMECHEAP_SSH_HOST \
            NAMECHEAP_SSH_USER \
            NAMECHEAP_SSH_PRIVATE_KEY \
            NAMECHEAP_SSH_KNOWN_HOSTS \
            NAMECHEAP_DEPLOY_PATH; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Missing GitHub Actions secret: $value"
              exit 1
            fi
          done

          if [[ ! "$NAMECHEAP_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::NAMECHEAP_SSH_HOST is not a valid hostname"
            exit 1
          fi
          if [[ ! "$NAMECHEAP_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::NAMECHEAP_SSH_USER is not valid"
            exit 1
          fi
          if [[ ! "$NAMECHEAP_DEPLOY_PATH" =~ ^/home/[A-Za-z0-9._-]+/public_html/?$ ]]; then
            echo "::error::NAMECHEAP_DEPLOY_PATH must be /home/CPANEL_USER/public_html"
            exit 1
          fi

      - name: Deploy release to Namecheap
        shell: bash
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/namecheap_deploy_key"
          known_hosts_file="$RUNNER_TEMP/namecheap_known_hosts"
          deploy_dir="$RUNNER_TEMP/gymfeed-deploy"

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file"
          chmod 644 "$known_hosts_file"

          ssh_options=(
            -i "$key_file"
            -p 21098
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$known_hosts_file"
          )

          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "test -d '$DEPLOY_PATH'"

          rsync \
            --archive \
            --compress \
            --delete \
            --delay-updates \
            --exclude '/cgi-bin/***' \
            --exclude '/.well-known/acme-challenge/***' \
            --itemize-changes \
            -e "ssh -i '$key_file' -p 21098 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts_file'" \
            "$deploy_dir/" \
            "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"

      - name: Verify production website
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 \
            https://gymfeed.io/ > /dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 \
            https://gymfeed.io/.well-known/assetlinks.json > /dev/null
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 \
            https://gymfeed.io/privacy/ > /dev/null
