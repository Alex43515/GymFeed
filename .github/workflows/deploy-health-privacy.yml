name: Publish GymFeed health privacy notice

# Mobile testing must not distribute a new data-use feature with an obsolete
# public policy. Deploy exactly this one public document, never the web app.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gymfeed-health-privacy-document
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test privacy retention and health disclosures
        run: node --test website/test/privacy-policy.test.mjs

      - name: Publish only privacy document and stylesheet with recoverable backups
        shell: bash
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing website deployment credential: $name"
              exit 1
            fi
          done
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/home/[A-Za-z0-9._-]+/public_html/?$ ]]
          source_file=website/public_html/privacy/index.html
          test -s "$source_file"
          test -s website/public_html/privacy/policy.css
          grep -Fq 'id="data-retention"' "$source_file"
          grep -Fq 'Connected health' "$source_file"
          grep -Fq 'separately enable AI sharing' "$source_file"

          key_file="$RUNNER_TEMP/privacy-deploy-key"
          known_hosts_file="$RUNNER_TEMP/privacy-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          remote_dir="${DEPLOY_PATH%/}/privacy"
          ssh -i "$key_file" -p 21098 -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" \
            "$SSH_USER@$SSH_HOST" "test -d '$remote_dir'"

          # No directory sync, --delete, main merge, or web-app replacement.
          rsync --archive --compress --chmod=F644 --delay-updates \
            --backup --suffix=".before-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -e "ssh -i '$key_file' -p 21098 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts_file'" \
            "$source_file" website/public_html/privacy/policy.css "$SSH_USER@$SSH_HOST:$remote_dir/"

      - name: Verify the live document matches this release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
                --connect-timeout 15 --max-time 45 \
                "https://gymfeed.io/privacy/?release=$GITHUB_SHA" \
                -o "$RUNNER_TEMP/live-privacy.html" && \
                cmp --silent website/public_html/privacy/index.html "$RUNNER_TEMP/live-privacy.html"; then
              echo 'Verified https://gymfeed.io/privacy/; no application files deployed.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::The live privacy document does not match this release.'
          exit 1
