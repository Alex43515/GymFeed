<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify your GymFeed email</title>
  </head>
  <body style="margin:0;background:#090909;color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#090909;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#151515;border:1px solid #2a2a2a;border-radius:22px;padding:30px;">
            <tr>
              <td>
                <div style="font-size:26px;font-weight:800;margin-bottom:28px;">Gym<span style="color:#1fe276;">Feed</span></div>
                <h1 style="font-size:26px;line-height:1.2;margin:0 0 12px;">Verify your email</h1>
                <p style="color:#a0a0a0;font-size:15px;line-height:1.6;margin:0 0 22px;">Enter this one-time code in GymFeed to finish creating your account:</p>
                <div style="background:#090909;border:1px solid #2a2a2a;border-radius:16px;color:#1fe276;font-size:34px;font-weight:800;letter-spacing:8px;padding:20px;text-align:center;">{{ .Token }}</div>
                <p style="color:#777777;font-size:13px;line-height:1.6;margin:22px 0 0;">Use the newest code only. If you did not create a GymFeed account, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
